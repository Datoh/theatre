<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pièce de théâtre</title>
    <style>
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: white;
            --bg-header: #34495e;
            --text-primary: #333;
            --text-secondary: #555;
            --text-muted: #666;
            --text-light: #7f8c8d;
            --border-color: #ddd;
            --border-light: #ecf0f1;
            --highlight-bg: #d6ebf7;
            --highlight-border: #3498db;
            --shadow-light: rgba(0,0,0,0.05);
            --shadow-medium: rgba(0,0,0,0.08);
            --shadow-dark: rgba(0,0,0,0.1);
            --modal-overlay: rgba(0,0,0,0.5);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0d0d0d;
                --bg-secondary: #3d3d3d;
                --bg-header: #0d0d0d;
                --text-primary: #ffffff;
                --text-secondary: #f5f5f5;
                --text-muted: #e0e0e0;
                --text-light: #cccccc;
                --border-color: #555555;
                --border-light: #4a4a4a;
                --highlight-bg: #2a5d8a;
                --highlight-border: #a8daff;
                --shadow-light: rgba(0,0,0,0.3);
                --shadow-medium: rgba(0,0,0,0.4);
                --shadow-dark: rgba(0,0,0,0.5);
                --modal-overlay: rgba(0,0,0,0.7);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile */
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background-color: var(--bg-header);
            color: white;
            padding: 12px 16px;
            text-align: center;
            box-shadow: 0 2px 4px var(--shadow-dark);
            z-index: 100;
            order: 1;
            flex-shrink: 0;
            min-height: 50px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }

        .fullscreen-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .fullscreen-btn:hover {
            opacity: 0.7;
        }

        .fullscreen-btn:active {
            opacity: 0.5;
        }

        /* Tab Navigation */
        .tabs {
            display: flex;
            background-color: #d5d5d5;
            border-top: 2px solid var(--border-color);
            box-shadow: 0 -4px 8px var(--shadow-light);
            order: 3;
            z-index: 999;
            flex-shrink: 0;
            min-height: 60px;
            height: 60px;
        }

        .tab {
            flex: 1;
            padding: 16px 0;
            text-align: center;
            background-color: #e8e8e8;
            border: none;
            color: #555;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab.active {
            background-color: #3498db;
            color: white;
            font-weight: 600;
        }
        
        @media (prefers-color-scheme: dark) {
            .tabs {
                background-color: #2c3e50;
            }
            
            .tab {
                background-color: #3d3d3d;
                color: #95a5a6;
            }
        }

        /* Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            background-color: var(--bg-primary);
            -webkit-overflow-scrolling: touch;
            order: 2;
            min-height: 0;
        }

        .tab-content {
            display: none;
            padding: 16px;
            animation: fadeIn 0.3s;
        }

        #read-tab,
        #learn-tab {
            padding: 0;
        }
        
        #learn-tab.active {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Settings Tab */
        .settings-content {
            background-color: var(--bg-secondary);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px var(--shadow-dark);
        }

        .settings-group {
            margin-bottom: 24px;
        }

        .settings-group:last-child {
            margin-bottom: 0;
        }

        .settings-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 16px;
        }

        .text-size-buttons {
            display: flex;
            gap: 10px;
        }

        .text-size-btn {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .text-size-btn:hover {
            border-color: #3498db;
        }

        .text-size-btn.active {
            background-color: #3498db;
            border-color: #3498db;
            color: white;
        }

        /* Text size variations */
        body.text-small {
            font-size: 14px;
        }

        body.text-small .dialogue-text {
            font-size: 14px;
        }

        body.text-small .dialogue-character {
            font-size: 12px;
        }

        body.text-normal {
            font-size: 16px;
        }

        body.text-normal .dialogue-text {
            font-size: 16px;
        }

        body.text-normal .dialogue-character {
            font-size: 14px;
        }

        body.text-large {
            font-size: 18px;
        }

        body.text-large .dialogue-text {
            font-size: 18px;
        }

        body.text-large .dialogue-character {
            font-size: 16px;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #3498db;
        }

        /* Line count table */
        .stats-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .stats-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
        }

        .stats-table th,
        .stats-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-light);
            text-align: right;
            white-space: nowrap;
        }

        .stats-table th:first-child,
        .stats-table td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            background-color: var(--bg-secondary);
        }

        .stats-table thead th {
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
        }

        .stats-table td {
            color: var(--text-secondary);
        }

        .stats-table td.zero {
            color: var(--text-light);
        }

        .stats-table .stats-total td,
        .stats-table .stats-total-col {
            font-weight: 600;
            color: var(--text-primary);
        }

        .stats-table .stats-total td {
            border-top: 2px solid var(--border-color);
            border-bottom: none;
        }

        .stats-table .mine {
            background-color: var(--highlight-bg);
        }

        /* Read Tab */
        .scene-block {
            background-color: transparent;
            border-radius: 8px;
            padding: 0 16px 16px 16px;
            margin-bottom: 16px;
        }

        .dialogue {
            margin-bottom: 12px;
            line-height: 1.6;
            background-color: var(--bg-secondary);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
        }

        .dialogue-character {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .dialogue-text {
            color: var(--text-secondary);
        }

        .dialogue.highlight {
            background-color: var(--highlight-bg);
            border: 2px solid var(--highlight-border);
        }

        /* Learn Tab */
        .learn-controls {
            background-color: var(--bg-secondary);
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -2px 4px var(--shadow-dark);
            flex-shrink: 0;
        }

        .learn-scene-header {
            background-color: #3498db;
            color: white;
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            box-shadow: 0 2px 4px var(--shadow-dark);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 10;
            margin-bottom: 12px;
        }

        .learn-scene-header:active {
            background-color: #2980b9;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-back {
            background-color: #3498db;
            color: white;
            flex: 1;
        }

        .btn-back:active {
            background-color: #2980b9;
        }

        .btn-next {
            background-color: #3498db;
            color: white;
            flex: 2;
        }

        .btn-next:active {
            background-color: #2980b9;
        }

        .btn-back:disabled,
        .btn-next:disabled {
            background-color: var(--border-light);
            color: #95a5a6;
            cursor: not-allowed;
        }

        .learn-content-area {
            background-color: transparent;
            padding: 16px;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .dialogue.my-character {
            background-color: var(--highlight-bg);
            border: 2px solid var(--highlight-border);
        }

        /* Navigation Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--modal-overlay);
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--bg-secondary);
            width: 90%;
            max-width: 400px;
            max-height: 70vh;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background-color: var(--bg-header);
            color: white;
            padding: 16px;
            font-weight: 600;
            font-size: 18px;
        }

        .modal-body {
            overflow-y: auto;
            max-height: calc(70vh - 60px);
        }

        .nav-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .nav-item:active {
            background-color: var(--border-light);
        }

        .nav-item.current {
            background-color: #e8f4f8;
            border-left: 4px solid #3498db;
        }

        @media (prefers-color-scheme: dark) {
            .nav-item.current {
                background-color: #1e3a4a;
            }
        }

        .nav-act {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 16px;
        }

        .nav-scene {
            color: var(--text-light);
            padding-left: 20px;
        }

        .arrow-icon {
            float: right;
            color: #95a5a6;
        }
    </style>
</head>
<body>
    <script>
        // Raw play text
        const rawPlayText = `@Vivien Lheraux
#À tous les coups !
##Acte 1
###Scène 1
Catherine : (Le logement de Catherine est insalubre. Les murs jaunis sont tachés d'humidité, le papier peint se détache par endroits et laisse apparaître le plâtre fissuré. Un seau est posé dans un coin de la pièce. Le mobilier est rare, usé et dépareillé : une table abîmée, quelques chaises bancales, un vieux fauteuil. Un petit meuble avec un tiroir supporte une lampe fatiguée, dont la lumière vacillera régulièrement, s'allumant et s'éteignant pour signaler les fréquentes pannes de courant. Une porte s'ouvre sur un couloir desservant la chambre, la cuisine et le balcon extérieur. Catherine est assise dans le fauteuil affaissé. Elle porte des vêtements sombres et sans éclat, ils sont propres mais fatigués. Une couverture usée repose sur ses genoux. D'une main, Catherine tient un stylo avec lequel elle note les mots qu'elle inscrit dans une grille de mots croisés. Elle porte par moments à ses lèvres une tasse de tisane. La lampe clignote par instants, plongeant brièvement la scène dans la pénombre.) Voyons... En 10 lettres : désastre, événement destructeur. Facile : cataclysme. En 11 lettres : situation tragique, soudaine. Catastrophe ? Oui, ça doit être ça. Catastrophe. En 11 lettres : (familier), embêtement, dérangement. (étonnée, elle regarde le public) Emmerdement ? C'est ça ? (Catherine regarde l'heure à son collier-montre. Elle a du mal à la lire car le cadran est inversé.)
Catherine : Muriel ne devrait pas tarder... Mon Dieu, je n'aurais jamais dû accepter qu'elle vienne... C'est de ma faute, je ne sais pas dire non. (On entend une sonnette qui fonctionne mal. La porte s'ouvre et Muriel entre. Très dynamique et enjouée, elle tient une valise et une pochette d'ordinateur portable. Elle porte un manteau abîmé et vieillot. Catherine se lève pour l'accueillir.)
Muriel    : (enthousiaste) Salut ! C'est moi ! Muriel ! (Muriel se précipite vers Catherine et lui fait la bise avec entrain. Catherine est un peu déconcertée par tant de familiarité.)
Muriel    : Ah ça fait plaisir ! Tu vas bien ? C'est quand même un sacré coup de bol d'être tombée sur toi sur Internet ! Il est génial ce site « Les années collèges » ! On s'inscrit et hop ! on retrouve des anciennes copines ! (Pendant la conversation, Muriel pose sa valise, enlève son manteau et le jette sur le fauteuil.)
Catherine : (pas très enthousiaste) Oui, c'est formidable.
Muriel    : C'était quand la dernière fois qu'on s'est vues, déjà ?
Catherine : C'était au collège justement.
Muriel    : Dis donc, t'as pas changé.
Catherine : Bah si quand même, depuis le temps.
Muriel    : En tout cas, t'es toujours aussi sympa. T'étais vraiment une bonne copine. Et tu sais quoi ? Je peux te le dire maintenant : au collège, t'étais « ma » meilleure copine. Si, si, c'est vrai. Et toi, tu me reconnais ?
Catherine : Non pas du tout. Et comme je te l'ai dit sur Internet, je ne me souviens pas qu'on était amies toutes les deux.
Muriel    : Mais enfin ! On était toujours fourrées ensemble ! Muriel et Caroline ! Les inséparables !
Catherine : Catherine, pas Caroline.
Muriel    : C'est ça ! Muriel et Catherine ! Qu'est-ce qu'on a pu se marrer, hein ?
Catherine : Je me rappelle surtout que je passais mon temps avec Françoise.
Muriel    : Françoise ? La petite toute maigre, toute pâle, toute moche et qui chialait tout le temps ?
Catherine : Elle était très malheureuse, la pauvre. On avait un point commun : j'avais été placée dans une famille d'accueil et elle aussi dans une autre.
Muriel    : En tout cas, moi, elle me foutait le bourdon. Qu'est-ce qu'elle est devenue ?
Catherine : On l'a retrouvée, il y a cinq ans.
Muriel    : On l'a retrouvée ? Pourquoi elle s'était perdue ? Remarque ça m'étonne pas, elle était pas fute-fute la Françoise, hein ?
Catherine : On l'a retrouvée pendue à une corde. (Catherine fait rapidement son signe de croix.)
Muriel    : Ah ouais ?... Bon à part ça, qu'est-ce que tu deviens ?
Catherine : Comme je t'ai dit sur Internet, je suis célibataire-caissière.
Muriel    : Eh bien tant mieux ! Dis-moi, ça caille chez toi, non ?
Catherine : Le chauffage est compris dans le loyer alors le propriétaire qui est très économe a bloqué le thermostat des radiateurs.
Muriel    : Ouais, c'est un radin quoi. C'est pas grave, tu me fileras un pull.
Catherine : Comme je t'ai dit, je veux bien t'accueillir chez moi un ou deux jours pour te dépanner mais pas plus. On est bien d'accord ?
Muriel    : Mais oui, t'inquiète. (Muriel jette un regard circulaire et découvre l'appartement peu à son goût.)
Muriel    : C'est toi qu'a choisi la déco ?
Catherine : Non, c'est un meublé et le propriétaire ne veut pas que je l'aménage à mon goût.
Muriel    : (en regardant un mur) Il se décolle un peu ton papier peint, non ?
Catherine : C'est à cause de l'humidité. J'ai des taches de moisissures sur tous les plafonds. Le pire c'est dans la salle de bains : la peinture s'écaille et en plus les carreaux de faïence n'arrêtent pas de tomber. Ce n'est vraiment pas pratique quand je prends une douche...
Muriel    : Tu m'étonnes... (en montrant le seau posé dans un coin de la pièce) Et le seau, là, je suppose que c'est pour des fuites au plafond ?
Catherine : Oui mais les fuites c'est seulement quand il pleut.
Muriel    : Génial... Et à part ça, il n'y a pas d'autres problèmes ?
Catherine : Non ça va. À part des fissures dans les murs, les portes qui se ferment mal, le parquet qui gondole dans la chambre, les robinets qui coincent et les radiateurs qui fuient.
Muriel    : Et sans parler de cette odeur. Ça sent quoi exactement ? Le moisi, les poubelles ou les égouts ?
Catherine : Les trois.
Muriel    : Et tu as signalé tous ces problèmes à ton propriétaire ?
Catherine : Oui mais il ne veut pas faire de travaux. Il possède tout l'immeuble : deux étages, huit appartements. Il est très riche mais ne veut rien dépenser.
Muriel    : Eh bien, il a l'air super sympa ton proprio... Et tu payes cher pour ce logement pourri ?
Catherine : Oui malheureusement, mais je n'ai rien trouvé d'autre.
Muriel    : Ton proprio est un marchand de sommeil, quoi...
Catherine : Je sais bien mais j'ai eu beaucoup de mal à trouver cet appartement. Je travaille à temps partiel, j'ai un petit salaire et je n'avais pas trop le choix. Au fait, monsieur Lavache ne doit pas savoir que je t'héberge.
Muriel    : Monsieur Lavache ? Qui c'est ça ?
Catherine : C'est mon propriétaire. Quand j'ai signé le bail, il a mis ses conditions : ne pas fumer, ne pas mettre de musique, ne pas cuisiner de poisson à cause des odeurs et surtout : aucun animal et aucun humain ne sont autorisés à venir ici.
Muriel    : Aucun humain ? Comment ça ?
Catherine : Je n'ai droit à aucune visite. Il veut le calme absolu.
Muriel    : Charmant Lavache.
Catherine : Son appartement est au même étage, au fond du couloir à droite. Tu devras rester très discrète.
Muriel    : T'inquiète, de toute façon je ne ferai pas de bruit, j'ai juste besoin de mon ordi pour mon business.
Catherine : Tu comptes travailler ici, chez moi ?!
Muriel    : Je ne t'en ai pas parlé ?
Catherine : Non.
Muriel    : Tu es sûre ?
Catherine : Certaine.
Muriel    : Ah oui ? Là, tu m'étonnes. Je vais bosser ici car comme je t'ai dit au niveau logement, en ce moment, c'est un peu compliqué pour moi.
Catherine : Tu as été mise à la porte ?
Muriel    : De mon ancien boulot, oui, il y a deux ans. Et de mon appartement, il y a huit jours mais je t'ai trouvée ! C'est du bol hein ?
Catherine : Muriel, on a dit seulement un ou deux jours.
Muriel    : Mais oui, t'inquiète. Bon, je t'explique mon taf : je viens de créer un site, il s'appelle : « Coaching énergie positive, développement personnel, santé et bien-être pour tous ». Je sais le titre est un peu long, il faut que j'en trouve un autre plus pêchu. Je vais te montrer. (Pendant la conversation, Muriel sort son ordinateur portable de sa pochette et l'allume. Elle branche ensuite à une prise de courant une rallonge électrique reliée à son ordinateur.)
Muriel    : Je peux le brancher là ?
Catherine : Non celle-ci ne marche pas, essaye l'autre plutôt. Mais pourquoi as-tu créé un site ? Je ne comprends pas.
Muriel    : Je vais coacher les gens en ligne. Je le branche, j'ai presque plus de batterie.
Catherine : Coacher les gens ? Mais dans quel but ?
Muriel    : Pour qu'ils retrouvent leur énergie positive et leur santé.
Catherine : (perplexe) Tu t'y connais en médecine, toi ? Tu as fait des études ?
Muriel    : Oui Madame, j'ai suivi une formation... Une formation de trois heures sur Internet.
Catherine : Trois heures ? Mais... Et ton activité est légale ?
Muriel    : Ce n'est pas interdit. Bon, tu veux voir comment je bosse avec mes clients ?
Catherine : Tu ne peux pas recevoir tes clients chez moi. Je ne veux pas d'histoire avec mon propriétaire.
Muriel    : Tout se fait sur Internet, je ne reçois personne, t'inquiète. Lavache peut dormir sur ses deux oreilles. Ça y est, je suis connectée. Regarde, la page d'accueil de mon site est sympa, non ?
Catherine : (pas convaincue) Peut-être, je ne sais pas.
Muriel    : Je dois juste attendre qu'un futur client se connecte.
Catherine : Et tu en as beaucoup des clients ?
Muriel    : Je t'ai dit que je viens juste de monter ma boîte. Le premier client va venir, il faut juste être patiente. C'est comme la pêche, tu mets de l'appât, tu attends en surveillant ta ligne et dès que ça mord à l'hameçon, hop ! tu attrapes le poisson et t'empoches le pognon !
Catherine : Je ne connais rien à la pêche.
Muriel    : Moi non plus, mon truc c'est le coaching. Tu veux que je te forme ?
Catherine : Moi ? Mais je ne saurais jamais.
Muriel    : Il faut juste avoir un peu de baratin. Tiens, par exemple, comment tu te sens en ce moment ? T'as la pêche ?
Catherine : Je t'ai dit que je n'ai aucune expérience dans le domaine de la pêche.
Muriel    : T'es en forme ou t'es plutôt crevée ?
Catherine : À vrai dire, je suis un peu fatiguée.
Muriel    : Tant mieux. Si une cliente est comme toi, complètement naze et déprimée, tu lui dis : fatigue, stress, pensées négatives, il est temps madame de purifier vos vibrations impures.
Catherine : Purifier mes vibrations impures ?
Muriel    : Voilà, c'est ça.
Catherine : Mais qu'est-ce que ça veut dire ?

Camille   : Évidemment...

Camille   : Je vous en prie, laissez-moi ! Je crois que je vais devenir cinglé si je reste.

Camille   : Je vous dis que je veux rentrer chez moi !

Muriel    : Eh oh, hein ! Le business c'est le business !

Catherine : Qu'est-ce qu'il a ?
Muriel    : Il est maboule j'te dis.

Muriel    : Où est passée cette imbécile ? Bouge pas, je vais la chercher ! (Muriel sort rapidement.)
##Acte 2
###Scène 1
Catherine : Je suis sincèrement désolée mais vous ne pouvez pas rester plus longtemps ici. Mon propriétaire ne l'accepte pas.

Florence  : Ça fait 1000 !

Florence  : 5000 !
Jean      : Hein ?

Jean      : J'ai dit la ferme !

Lavache   : Où est ma bouteille Thermos ?!
Muriel    : (en indiquant Florence) Elle l'a entièrement vidée. Là, elle récupère...
Lavache   : Je vais vous en raconter une bien bonne. Chaque matin, j'ai l'habitude de verser un produit chimique au pied de mes plantes pour les aider à pousser. Je mets toujours ce produit chimique dans une bouteille en verre et là, allez savoir pourquoi, j'ai fait une petite erreur.

Lavache   : J'ai versé mon Détox maison dans mes pots de fleurs... et j'ai mis le produit chimique dans ma bouteille Thermos.
Catherine : Vous avez inversé les deux récipients ?!
Camille   : On a bu de l'engrais industriel ?!
Lavache   : Et alors ? De toute façon, je crois qu'il n'y a pas trop d'effets indésirables...
Florence  : (Elle crie en dormant) Les dinosaures attaquent !!!

Lavache   : En tout cas mes plantes ont eu une réaction étrange. Elles ont pris 10 cm en quelques minutes et après elles sont devenues toutes sèches et ont viré au jaune-marron. (à Catherine) Bien entendu, vous rembourserez mes plantes sur votre dernier loyer.
Catherine : Mon Dieu...
Camille   : Attendez deux minutes. Vous êtes bien le propriétaire de tout l'immeuble, c'est-à-dire des huit appartements ?
Lavache   : Oui, et alors ?
Camille   : Je constate que cet appartement est insalubre. Vous êtes certainement au courant ?
Lavache   : Et qu'est-ce que ça peut vous faire ?!
Camille   : Vous connaissez mon métier ?
Lavache   : Mais je m'en contrefous !
Camille   : Je travaille au service technique des habitations.
Lavache   : Ça me fait une belle jambe.
Camille   : Je vous explique. À Paris, quand il y a un logement ou un immeuble dangereux ou insalubre, c'est mon service qui s'en occupe... (Lavache est désormais très inquiet.)
Camille   : Mon job consiste à visiter les logements qui sont insalubres. Exactement comme celui-ci.

Muriel    : Au préfet ! Ah ça rigole moins, là !
Camille   : Après, le préfet peut obliger le propriétaire à faire tous les travaux nécessaires. Ici, d'après ce que je vois, et surtout pour huit appartements, ça va vous coûter une fortune.
Lavache   : Vous n'allez pas oser !

Lavache   : Ordure !

Lavache   : Ah ! Il y a tout de même une justice !
Camille   : Mais si vous ne les faites pas, le préfet ordonnera la démolition de votre immeuble. Je n'aimerais pas du tout être à votre place, Monsieur Lavache...
Muriel    : Lui aussi il va être viré ! Bien fait ! C'est terminé les vacheries !
Lavache   : (Choqué, à Camille) Vous... Vous... Allez ! On va arranger tout ça. Attendez. (Lavache sort une liasse de billets de sa poche qu'il tend à Camille. Camille ne la prend pas.)
Lavache   : Prenez et oubliez la visite, le rapport, le préfet. On se comprend ?
Camille   : Je comprends parfaitement.
Lavache   : Ah, tant mieux !

Catherine : Les tribunaux apprécieront...
Camille   : Oui c'est sûr...
Muriel    : Là, ça pique...
Camille   : Vous avez définitivement perdu la partie Monsieur Lavache. Adieu. (Lavache est choqué, il a du mal à retrouver la direction de la sortie.)
Muriel    : La sortie est ici. Bye, bye... (Lavache, abasourdi et sonné, se dirige vers la sortie. Au même instant, Jean entre.)
Camille   : Ah non pas lui ! Pas lui !
Jean      : Eh oh ça va ! Je viens juste récupérer mon flingue ! Mon revolver ! Il est où ?
Catherine : On vous le donne mais après soyez gentil, partez.
Jean      : Parce que tu crois que j'ai envie de rester dans ton clapier qui pue des pieds ? (Jean voit son frère choqué et silencieux. Pendant ce temps Camille ouvre le tiroir du meuble et récupère le revolver.)
Jean      : Il en fait une tête d'abruti, qu'est-ce qu'il a ?
Muriel    : Votre frangin vient d'apprendre une super nouvelle ! Il est ruiné et il est viré de chez lui !

Jean      : Ça va, j'suis pas con ! (en sortant, à son frère) Ce qui compte c'est d'avoir du jeu, si t'as une paire tu montes, si t'as rien tu te couches. T'as compris ?
Lavache   : (toujours choqué) Oui, je me couche... (Lavache et Jean sont sortis.)
Muriel    : Alors là, moi je dis bravo !

Muriel    : Ça, c'est grâce à ma séance de coaching ! (Florence se réveille, s'étire et se lève.)
Florence  : Ah, j'ai drôlement bien dormi, moi. Qu'est-ce qui se passe ?

Camille   : Tu viens Catherine ? On va chez moi ? Enfin, chez nous...

Florence  : Salut.

Muriel    : T'inquiète, je vais me débrouiller.

Muriel    : Évidemment, oui. Et j'irai même vous faire un petit coucou. (Camille et Catherine, heureux, sortent.)

Florence  : Dans le 14ème, pourquoi ?
Muriel    : C'est drôle mais dès que je t'ai vue, je t'ai trouvée super sympa. C'est pas trop petit chez toi ?

Muriel    : Tu sais quoi ? Je t'accompagne.
Florence  : Ah bon ?

Muriel    : Tiens, prends donc mon ordi. Tu sais que j'ai créé un site ?
Florence  : (en prenant l'ordinateur portable) Ah bon ?
Muriel    : « Coaching énergie positive, développement personnel, santé et bien-être pour tous » ! Je t'expliquerai quand on sera chez toi. Si tu veux, je pourrai même te former. Y'a un tas de pognon à se faire, tu verras. (Elles se dirigent vers la porte.)
Florence  : Ça a l'air drôlement intéressant, dis donc. (Muriel se tourne vers le public.)
Muriel    : (au public) J'ai besoin de clients, venez donc nous voir à l'occasion !!
Florence  : (au public) Oui ! Et on fêtera ensemble mon anniversaire !!! (Florence et Muriel sortent.) (Tous les comédiens reviennent sur scène et applaudissent le public.)`;
    </script>

    <script>
        // Parse the play text
        function parsePlayText(text) {
            const lines = text.split('\n');
            const playData = {
                title: '',
                acts: []
            };

            let currentAct = null;
            let currentScene = null;

            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                // Title (# Title)
                if (line.startsWith('#') && !line.startsWith('##')) {
                    playData.title = line.substring(1).trim();
                }
                // Act (## Act X)
                else if (line.startsWith('##') && !line.startsWith('###')) {
                    currentAct = {
                        title: line.substring(2).trim(),
                        scenes: []
                    };
                    playData.acts.push(currentAct);
                    currentScene = null;
                }
                // Scene (### Scene X)
                else if (line.startsWith('###')) {
                    if (currentAct) {
                        currentScene = {
                            title: line.substring(3).trim(),
                            dialogues: []
                        };
                        currentAct.scenes.push(currentScene);
                    }
                }
                // Dialogue (Character : Text)
                else if (line.includes(':')) {
                    const colonIndex = line.indexOf(':');
                    const character = line.substring(0, colonIndex).trim();
                    const text = line.substring(colonIndex + 1).trim();
                    
                    if (currentScene && character && text) {
                        currentScene.dialogues.push({
                            character: character,
                            text: text
                        });
                    }
                }
            });

            return playData;
        }

        // Parse the play data
        const playData = parsePlayText(rawPlayText);

        // Update page title
        document.title = playData.title || 'Pièce de théâtre';

        // State management
        let currentTab = 'read';
        let selectedCharacter = '';
        let learnState = {
            actIndex: 0,
            sceneIndex: 0,
            lineIndex: 0
        };
        let readState = {
            actIndex: 0,
            sceneIndex: 0
        };

        // Storage management functions (localStorage works with file://)
        function setStorage(name, value) {
            try {
                localStorage.setItem(name, value);
            } catch (e) {
                console.error('Error saving to localStorage:', e);
            }
        }

        function getStorage(name) {
            try {
                return localStorage.getItem(name);
            } catch (e) {
                console.error('Error reading from localStorage:', e);
                return null;
            }
        }

        // Extract unique characters
        function getCharacters() {
            const characters = new Set();
            playData.acts.forEach(act => {
                act.scenes.forEach(scene => {
                    scene.dialogues.forEach(dialogue => {
                        characters.add(dialogue.character);
                    });
                });
            });
            return Array.from(characters).sort();
        }

        // Generate a consistent color for each character
        const characterColors = {};
        
        // Color palettes for light and dark modes
        const colorPalettesLight = [
            '#c0392b', // dark red
            '#2980b9', // dark blue
            '#27ae60', // dark green
            '#d68910', // dark orange
            '#8e44ad', // dark purple
            '#16a085', // dark turquoise
            '#d35400', // dark carrot
            '#2c3e50', // very dark blue
            '#117a65', // very dark green
            '#922b21', // very dark red
            '#6c3483', // dark wisteria
            '#1e8449', // dark nephritis
        ];

        const colorPalettesDark = [
            '#ff6b6b', // bright red
            '#74b9ff', // bright blue
            '#55efc4', // bright green
            '#ffd93d', // bright yellow
            '#dda0dd', // bright plum
            '#6bcf7f', // bright mint
            '#ffa07a', // bright salmon
            '#87ceeb', // sky blue
            '#98d8c8', // light teal
            '#ff9999', // light coral
            '#c39bd3', // light purple
            '#90ee90', // light green
        ];

        function isDarkMode() {
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        function getCharacterColor(character) {
            if (!characterColors[character]) {
                const colorPalette = isDarkMode() ? colorPalettesDark : colorPalettesLight;
                const characters = Object.keys(characterColors);
                const colorIndex = characters.length % colorPalette.length;
                characterColors[character] = colorPalette[colorIndex];
            }
            return characterColors[character];
        }

        // Listen for theme changes and update colors
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                // Reset character colors to apply new palette
                Object.keys(characterColors).forEach(key => delete characterColors[key]);
                renderStats();
                
                // Re-render current tab
                if (currentTab === 'read') {
                    renderReadTab();
                } else if (currentTab === 'learn') {
                    renderLearnTab();
                }
            });
        }

        // Render the line count table (scenes x characters, with totals)
        function renderStats() {
            const container = document.getElementById('stats-table');
            const totals = {};
            const rows = [];
            playData.acts.forEach(act => {
                act.scenes.forEach(scene => {
                    const counts = {};
                    scene.dialogues.forEach(dialogue => {
                        counts[dialogue.character] = (counts[dialogue.character] || 0) + 1;
                        totals[dialogue.character] = (totals[dialogue.character] || 0) + 1;
                    });
                    const label = act.scenes.length > 1 ? `${act.title}, ${scene.title}` : act.title;
                    rows.push({ label, counts, total: scene.dialogues.length });
                });
            });
            const characters = Object.keys(totals).sort((a, b) => totals[b] - totals[a] || a.localeCompare(b));
            const grandTotal = rows.reduce((sum, row) => sum + row.total, 0);

            const table = document.createElement('table');
            table.className = 'stats-table';
            const addCell = (tr, tag, text, className) => {
                const cell = document.createElement(tag);
                cell.textContent = text;
                if (className) cell.className = className;
                tr.appendChild(cell);
                return cell;
            };
            const mine = character => character === selectedCharacter ? 'mine' : '';

            const head = table.createTHead().insertRow();
            addCell(head, 'th', 'Scène');
            characters.forEach(character => {
                addCell(head, 'th', character, mine(character)).style.color = getCharacterColor(character);
            });
            addCell(head, 'th', 'Total');

            const body = table.createTBody();
            rows.forEach(row => {
                const tr = body.insertRow();
                addCell(tr, 'td', row.label);
                characters.forEach(character => {
                    const count = row.counts[character] || 0;
                    addCell(tr, 'td', count || '–', [mine(character), count ? '' : 'zero'].join(' ').trim());
                });
                addCell(tr, 'td', row.total, 'stats-total-col');
            });

            const totalRow = body.insertRow();
            totalRow.className = 'stats-total';
            addCell(totalRow, 'td', 'Total');
            characters.forEach(character => addCell(totalRow, 'td', totals[character], mine(character)));
            addCell(totalRow, 'td', grandTotal);

            container.innerHTML = '';
            container.appendChild(table);
        }

        // Update page title with character if selected
        function updateTitle() {
            const baseTitle = playData.title;
            const displayTitle = selectedCharacter ? `${baseTitle} - ${selectedCharacter}` : baseTitle;
            document.getElementById('play-title').textContent = displayTitle;
        }

        // Initialize the app
        function init() {
            // Load settings first
            loadSettings();
            
            // Setup UI
            populateCharacterSelect();
            updateTitle();
            renderStats();
            setupTabs();
            
            // Restore saved tab or default to 'read'
            const savedTab = getStorage('currentTab') || 'read';
            switchTab(savedTab);
        }

        // Populate character dropdown
        function populateCharacterSelect() {
            const select = document.getElementById('character-select');
            const characters = getCharacters();
            characters.forEach(char => {
                const option = document.createElement('option');
                option.value = char;
                option.textContent = char;
                select.appendChild(option);
            });

            select.addEventListener('change', (e) => {
                selectedCharacter = e.target.value;
                saveSettings();
                updateTitle();
                renderStats();
                
                // Re-render current tab
                if (currentTab === 'read') {
                    renderReadTab();
                } else if (currentTab === 'learn') {
                    renderLearnTab();
                }
            });
            
            // Text size buttons
            document.querySelectorAll('.text-size-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const size = this.dataset.size;
                    applyTextSize(size);
                    setStorage('textSize', size);
                });
            });

            // Fullscreen button
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', toggleFullscreen);
            }
        }

        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
                // Enter fullscreen
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.mozRequestFullScreen) {
                    elem.mozRequestFullScreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                // Exit fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        // Setup tab navigation
        function setupTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabName = tab.getAttribute('data-tab');
                    switchTab(tabName);
                });
            });
        }

        // Switch between tabs
        function switchTab(tabName) {
            currentTab = tabName;
            setStorage('currentTab', tabName);
            
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.getAttribute('data-tab') === tabName) {
                    tab.classList.add('active');
                }
            });

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`${tabName}-tab`).classList.add('active');

            // Render specific tab content if needed
            if (tabName === 'learn') {
                renderLearnTab();
            } else if (tabName === 'read') {
                renderReadTab();
            }
        }

        // Render Read Tab
        function renderReadTab() {
            const container = document.getElementById('read-content');
            container.innerHTML = '';

            playData.acts.forEach((act, actIndex) => {
                act.scenes.forEach((scene, sceneIndex) => {
                    const sceneTitle = document.createElement('div');
                    sceneTitle.className = 'learn-scene-header';
                    
                    const titleSpan = document.createElement('span');
                    titleSpan.textContent = `${act.title}, ${scene.title}`;
                    
                    const arrowSpan = document.createElement('span');
                    arrowSpan.className = 'arrow-icon';
                    arrowSpan.textContent = '▼';
                    
                    sceneTitle.appendChild(titleSpan);
                    sceneTitle.appendChild(arrowSpan);
                    sceneTitle.onclick = () => {
                        readState.actIndex = actIndex;
                        readState.sceneIndex = sceneIndex;
                        setStorage('readState', readState);
                        openNavigation('read');
                    };
                    
                    container.appendChild(sceneTitle);

                    const sceneBlock = document.createElement('div');
                    sceneBlock.className = 'scene-block';

                    scene.dialogues.forEach(dialogue => {
                        const dialogueDiv = document.createElement('div');
                        dialogueDiv.className = 'dialogue';
                        
                        if (selectedCharacter && dialogue.character === selectedCharacter) {
                            dialogueDiv.classList.add('highlight');
                        }

                        const charSpan = document.createElement('span');
                        charSpan.className = 'dialogue-character';
                        charSpan.textContent = dialogue.character;
                        charSpan.style.color = getCharacterColor(dialogue.character);

                        const textSpan = document.createElement('span');
                        textSpan.className = 'dialogue-text';
                        textSpan.textContent = dialogue.text;

                        dialogueDiv.appendChild(charSpan);
                        dialogueDiv.appendChild(textSpan);
                        sceneBlock.appendChild(dialogueDiv);
                    });

                    container.appendChild(sceneBlock);
                });
            });
            
            // Validate readState indices
            if (readState.actIndex >= playData.acts.length) {
                readState.actIndex = 0;
            }
            if (readState.sceneIndex >= playData.acts[readState.actIndex].scenes.length) {
                readState.sceneIndex = 0;
            }
            
            // Scroll to the saved scene position
            setTimeout(() => {
                const sceneBlocks = document.querySelectorAll('#read-content .scene-block');
                let totalSceneIndex = 0;
                for (let i = 0; i < readState.actIndex; i++) {
                    totalSceneIndex += playData.acts[i].scenes.length;
                }
                totalSceneIndex += readState.sceneIndex;
                
                if (sceneBlocks[totalSceneIndex]) {
                    sceneBlocks[totalSceneIndex].scrollIntoView({ behavior: 'auto', block: 'start' });
                }
            }, 0);
        }

        // Render Learn Tab
        function renderLearnTab(clearContent = true) {
            const content = document.getElementById('learn-content');
            if (clearContent) {
                content.innerHTML = '';
            }

            // Check if no character is selected
            if (!selectedCharacter) {
                content.innerHTML = '<div style="padding: 40px 20px; text-align: center;"><p style="color: var(--text-secondary); font-size: 18px; margin-bottom: 16px;">Aucun personnage sélectionné</p><p style="color: var(--text-muted); font-size: 14px;">Veuillez sélectionner un personnage dans l\'onglet Paramètres pour commencer l\'apprentissage.</p></div>';
                document.getElementById('line-counter').textContent = '0 / 0';
                const nextButton = document.querySelector('.btn-next');
                const backButton = document.querySelector('.btn-back');
                if (nextButton) nextButton.disabled = true;
                if (backButton) backButton.disabled = true;
                return;
            }

            // Validate learnState indices
            if (learnState.actIndex >= playData.acts.length) {
                learnState.actIndex = 0;
            }
            if (learnState.sceneIndex >= playData.acts[learnState.actIndex].scenes.length) {
                learnState.sceneIndex = 0;
            }

            // Get current scene
            const act = playData.acts[learnState.actIndex];
            const scene = act.scenes[learnState.sceneIndex];

            // Update scene header
            document.getElementById('learn-current-scene').textContent = 
                `${act.title}, ${scene.title}`;

            const lines = scene.dialogues;

            if (lines.length === 0) {
                content.innerHTML = '<p style="color: #95a5a6; text-align: center;">Aucune réplique dans cette scène.</p>';
                document.getElementById('line-counter').textContent = '0 / 0';
                return;
            }

            // Find character's lines and their indices
            const characterLines = [];
            lines.forEach((dialogue, index) => {
                if (dialogue.character === selectedCharacter) {
                    characterLines.push(index);
                }
            });

            if (characterLines.length === 0) {
                content.innerHTML = '<p style="color: #95a5a6; text-align: center;">Aucune réplique pour ce personnage dans cette scène.</p>';
                document.getElementById('line-counter').textContent = '0 / 0';
                return;
            }

            // Update counter based on character's lines
            document.getElementById('line-counter').textContent = 
                `${learnState.lineIndex} / ${characterLines.length}`;

            // When clearContent is true (initial load or restart), show all dialogues up to current state
            // When clearContent is false (appending), show only the new dialogues
            let startIndex, endIndex;
            
            if (clearContent) {
                // Show all dialogues from start up to current lineIndex
                startIndex = 0;
                if (learnState.lineIndex === 0) {
                    endIndex = characterLines[0];
                } else {
                    const currentCharLineIndex = Math.min(learnState.lineIndex - 1, characterLines.length - 1);
                    endIndex = learnState.lineIndex < characterLines.length 
                        ? characterLines[learnState.lineIndex] 
                        : lines.length;
                }
            } else {
                // Append mode: show only new dialogues
                if (learnState.lineIndex === 0) {
                    startIndex = 0;
                    endIndex = characterLines[0];
                } else {
                    const currentCharLineIndex = Math.min(learnState.lineIndex - 1, characterLines.length - 1);
                    startIndex = characterLines[currentCharLineIndex];
                    endIndex = learnState.lineIndex < characterLines.length 
                        ? characterLines[learnState.lineIndex] 
                        : lines.length;
                }
            }

            // Display the dialogues in the range
            for (let i = startIndex; i < endIndex; i++) {
                const dialogue = lines[i];
                const dialogueDiv = document.createElement('div');
                dialogueDiv.className = 'dialogue';
                
                // Highlight selected character's lines
                if (dialogue.character === selectedCharacter) {
                    dialogueDiv.classList.add('my-character');
                }

                const charSpan = document.createElement('span');
                charSpan.className = 'dialogue-character';
                charSpan.textContent = dialogue.character;
                charSpan.style.color = getCharacterColor(dialogue.character);

                const textSpan = document.createElement('span');
                textSpan.className = 'dialogue-text';
                textSpan.textContent = dialogue.text;

                dialogueDiv.appendChild(charSpan);
                dialogueDiv.appendChild(textSpan);
                content.appendChild(dialogueDiv);
            }
            
            // Update button state
            const nextButton = document.querySelector('.btn-next');
            const backButton = document.querySelector('.btn-back');
            if (nextButton) {
                nextButton.disabled = learnState.lineIndex >= characterLines.length;
            }
            if (backButton) {
                backButton.disabled = learnState.lineIndex === 0;
            }
        }

        // Next line in Learn mode
        function nextLine() {
            const act = playData.acts[learnState.actIndex];
            const scene = act.scenes[learnState.sceneIndex];
            const lines = scene.dialogues;

            // If no character selected, advance one line at a time
            if (!selectedCharacter) {
                if (learnState.lineIndex < lines.length - 1) {
                    learnState.lineIndex++;
                    saveSettings();
                    renderLearnTab();
                }
                return;
            }

            // Find character's lines
            const characterLines = [];
            lines.forEach((dialogue, index) => {
                if (dialogue.character === selectedCharacter) {
                    characterLines.push(index);
                }
            });

            // Advance to next step
            if (learnState.lineIndex < characterLines.length) {
                const oldLineIndex = learnState.lineIndex;
                learnState.lineIndex++;
                saveSettings();
                renderLearnTab(false); // Don't clear content, just append
                
                // Scroll to the first newly added dialogue
                setTimeout(() => {
                    const content = document.getElementById('learn-content');
                    const newDialogues = content.querySelectorAll('.dialogue');
                    
                    // Calculate the index of the first new dialogue
                    let firstNewIndex = 0;
                    if (oldLineIndex === 0) {
                        // On first click, scroll to the character's first line
                        firstNewIndex = characterLines[0];
                    } else {
                        const prevCharLineIndex = oldLineIndex - 1;
                        const prevEndIndex = oldLineIndex < characterLines.length 
                            ? characterLines[oldLineIndex] 
                            : lines.length;
                        firstNewIndex = prevEndIndex;
                    }
                    
                    if (newDialogues[firstNewIndex]) {
                        newDialogues[firstNewIndex].scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }, 50);
            }
        }

        // Restart scene in Learn mode
        function restartScene() {
            learnState.lineIndex = 0;
            saveSettings();
            renderLearnTab(true); // Clear content and restart
        }

        // Open navigation modal
        function openNavigation(source) {
            const modal = document.getElementById('navigation-modal');
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = '';

            playData.acts.forEach((act, actIndex) => {
                const actItem = document.createElement('div');
                actItem.className = 'nav-item nav-act';
                actItem.textContent = act.title;
                actItem.onclick = () => navigateToScene(actIndex, 0, source);
                modalBody.appendChild(actItem);

                act.scenes.forEach((scene, sceneIndex) => {
                    const sceneItem = document.createElement('div');
                    sceneItem.className = 'nav-item nav-scene';
                    sceneItem.textContent = scene.title;
                    sceneItem.onclick = () => navigateToScene(actIndex, sceneIndex, source);

                    if (source === 'learn' && actIndex === learnState.actIndex && sceneIndex === learnState.sceneIndex) {
                        sceneItem.classList.add('current');
                    }

                    modalBody.appendChild(sceneItem);
                });
            });

            modal.classList.add('active');
        }

        // Close navigation modal
        function closeNavigation(event) {
            if (event.target.id === 'navigation-modal') {
                document.getElementById('navigation-modal').classList.remove('active');
            }
        }

        // Navigate to a specific scene
        function navigateToScene(actIndex, sceneIndex, source) {
            if (source === 'learn') {
                learnState.actIndex = actIndex;
                learnState.sceneIndex = sceneIndex;
                learnState.lineIndex = 0;
                saveSettings();
                renderLearnTab();
            } else if (source === 'read') {
                readState.actIndex = actIndex;
                readState.sceneIndex = sceneIndex;
                saveSettings();
                
                // Scroll to the scene block
                const sceneBlocks = document.querySelectorAll('#read-content .scene-block');
                let totalSceneIndex = 0;
                for (let i = 0; i < actIndex; i++) {
                    totalSceneIndex += playData.acts[i].scenes.length;
                }
                totalSceneIndex += sceneIndex;
                
                if (sceneBlocks[totalSceneIndex]) {
                    sceneBlocks[totalSceneIndex].scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }

            closeNavigation({ target: { id: 'navigation-modal' } });
        }

        // Save settings to localStorage
        function saveSettings() {
            setStorage('selectedCharacter', selectedCharacter);
            setStorage('readState', JSON.stringify(readState));
            setStorage('learnState', JSON.stringify(learnState));
        }

        // Load settings from localStorage
        function loadSettings() {
            const savedCharacter = getStorage('selectedCharacter');
            if (savedCharacter) {
                selectedCharacter = savedCharacter;
                const select = document.getElementById('character-select');
                if (select) {
                    select.value = savedCharacter;
                }
            }

            const savedReadState = getStorage('readState');
            if (savedReadState) {
                try {
                    readState = JSON.parse(savedReadState);
                } catch (e) {
                    console.error('Error parsing readState:', e);
                }
            }

            const savedLearnState = getStorage('learnState');
            if (savedLearnState) {
                try {
                    learnState = JSON.parse(savedLearnState);
                } catch (e) {
                    console.error('Error parsing learnState:', e);
                }
            }
            
            // Load and apply text size
            const textSize = getStorage('textSize') || 'normal';
            applyTextSize(textSize);
        }
        
        // Apply text size to body
        function applyTextSize(size) {
            document.body.classList.remove('text-small', 'text-normal', 'text-large');
            document.body.classList.add(`text-${size}`);
            
            // Update button states
            document.querySelectorAll('.text-size-btn').forEach(btn => {
                if (btn.dataset.size === size) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Initialize the app when DOM is ready
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
