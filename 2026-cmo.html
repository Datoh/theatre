<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pièce de théâtre</title>
    <style>
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: white;
            --bg-header: #34495e;
            --text-primary: #333;
            --text-secondary: #555;
            --text-muted: #666;
            --text-light: #7f8c8d;
            --border-color: #ddd;
            --border-light: #ecf0f1;
            --highlight-bg: #d6ebf7;
            --highlight-border: #3498db;
            --shadow-light: rgba(0,0,0,0.05);
            --shadow-medium: rgba(0,0,0,0.08);
            --shadow-dark: rgba(0,0,0,0.1);
            --modal-overlay: rgba(0,0,0,0.5);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0d0d0d;
                --bg-secondary: #3d3d3d;
                --bg-header: #0d0d0d;
                --text-primary: #ffffff;
                --text-secondary: #f5f5f5;
                --text-muted: #e0e0e0;
                --text-light: #cccccc;
                --border-color: #555555;
                --border-light: #4a4a4a;
                --highlight-bg: #2a5d8a;
                --highlight-border: #a8daff;
                --shadow-light: rgba(0,0,0,0.3);
                --shadow-medium: rgba(0,0,0,0.4);
                --shadow-dark: rgba(0,0,0,0.5);
                --modal-overlay: rgba(0,0,0,0.7);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile */
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background-color: var(--bg-header);
            color: white;
            padding: 12px 16px;
            text-align: center;
            box-shadow: 0 2px 4px var(--shadow-dark);
            z-index: 100;
            order: 1;
            flex-shrink: 0;
            min-height: 50px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }

        .fullscreen-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .fullscreen-btn:hover {
            opacity: 0.7;
        }

        .fullscreen-btn:active {
            opacity: 0.5;
        }

        /* Tab Navigation */
        .tabs {
            display: flex;
            background-color: #d5d5d5;
            border-top: 2px solid var(--border-color);
            box-shadow: 0 -4px 8px var(--shadow-light);
            order: 3;
            z-index: 999;
            flex-shrink: 0;
            min-height: 60px;
            height: 60px;
        }

        .tab {
            flex: 1;
            padding: 16px 0;
            text-align: center;
            background-color: #e8e8e8;
            border: none;
            color: #555;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab.active {
            background-color: #3498db;
            color: white;
            font-weight: 600;
        }
        
        @media (prefers-color-scheme: dark) {
            .tabs {
                background-color: #2c3e50;
            }
            
            .tab {
                background-color: #3d3d3d;
                color: #95a5a6;
            }
        }

        /* Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            background-color: var(--bg-primary);
            -webkit-overflow-scrolling: touch;
            order: 2;
            min-height: 0;
        }

        .tab-content {
            display: none;
            padding: 16px;
            animation: fadeIn 0.3s;
        }

        #read-tab,
        #learn-tab {
            padding: 0;
        }
        
        #learn-tab.active {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Settings Tab */
        .settings-content {
            background-color: var(--bg-secondary);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px var(--shadow-dark);
        }

        .settings-group {
            margin-bottom: 24px;
        }

        .settings-group:last-child {
            margin-bottom: 0;
        }

        .settings-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 16px;
        }

        .text-size-buttons {
            display: flex;
            gap: 10px;
        }

        .text-size-btn {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .text-size-btn:hover {
            border-color: #3498db;
        }

        .text-size-btn.active {
            background-color: #3498db;
            border-color: #3498db;
            color: white;
        }

        /* Text size variations */
        body.text-small {
            font-size: 14px;
        }

        body.text-small .dialogue-text {
            font-size: 14px;
        }

        body.text-small .dialogue-character {
            font-size: 12px;
        }

        body.text-normal {
            font-size: 16px;
        }

        body.text-normal .dialogue-text {
            font-size: 16px;
        }

        body.text-normal .dialogue-character {
            font-size: 14px;
        }

        body.text-large {
            font-size: 18px;
        }

        body.text-large .dialogue-text {
            font-size: 18px;
        }

        body.text-large .dialogue-character {
            font-size: 16px;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #3498db;
        }

        /* Read Tab */
        .scene-block {
            background-color: transparent;
            border-radius: 8px;
            padding: 0 16px 16px 16px;
            margin-bottom: 16px;
        }

        .dialogue {
            margin-bottom: 12px;
            line-height: 1.6;
            background-color: var(--bg-secondary);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
        }

        .dialogue-character {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .dialogue-text {
            color: var(--text-secondary);
        }

        .dialogue.highlight {
            background-color: var(--highlight-bg);
            border: 2px solid var(--highlight-border);
        }

        /* Learn Tab */
        .learn-controls {
            background-color: var(--bg-secondary);
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -2px 4px var(--shadow-dark);
            flex-shrink: 0;
        }

        .learn-scene-header {
            background-color: #3498db;
            color: white;
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            box-shadow: 0 2px 4px var(--shadow-dark);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 10;
            margin-bottom: 12px;
        }

        .learn-scene-header:active {
            background-color: #2980b9;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-back {
            background-color: #3498db;
            color: white;
            flex: 1;
        }

        .btn-back:active {
            background-color: #2980b9;
        }

        .btn-next {
            background-color: #3498db;
            color: white;
            flex: 2;
        }

        .btn-next:active {
            background-color: #2980b9;
        }

        .btn-back:disabled,
        .btn-next:disabled {
            background-color: var(--border-light);
            color: #95a5a6;
            cursor: not-allowed;
        }

        .learn-content-area {
            background-color: transparent;
            padding: 16px;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .dialogue.my-character {
            background-color: var(--highlight-bg);
            border: 2px solid var(--highlight-border);
        }

        /* Navigation Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--modal-overlay);
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--bg-secondary);
            width: 90%;
            max-width: 400px;
            max-height: 70vh;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background-color: var(--bg-header);
            color: white;
            padding: 16px;
            font-weight: 600;
            font-size: 18px;
        }

        .modal-body {
            overflow-y: auto;
            max-height: calc(70vh - 60px);
        }

        .nav-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .nav-item:active {
            background-color: var(--border-light);
        }

        .nav-item.current {
            background-color: #e8f4f8;
            border-left: 4px solid #3498db;
        }

        @media (prefers-color-scheme: dark) {
            .nav-item.current {
                background-color: #1e3a4a;
            }
        }

        .nav-act {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 16px;
        }

        .nav-scene {
            color: var(--text-light);
            padding-left: 20px;
        }

        .arrow-icon {
            float: right;
            color: #95a5a6;
        }
    </style>
</head>
<body>
    <script>
        // Raw play text
        const rawPlayText = `#Coach me oui !!!
##Acte 1
###Scène 1
Matou  : (Au lever de rideau, la scène est plongée dans la pénombre. Seul un projecteur éclaire l'horloge, côté cour, il est 6 heures du matin. On est chez Bruno et Nicole, appartement cosy. Un canapé. Côté cour l'entrée, côté jardin la chambre. Nicole et Bruno sont du côté jardin dans leur lit mais on ne les voit pas, on les entend juste. Depuis les coulisses, on entend une voix masculine de type « tutoriel audio » ou « message vocal » diffusée en fond. C'est Mathis, le coach : nouveau programme pré-enregistré, ton ultra-dynamique, gourou et disjoncté.) (voix enregistrée) On se réveille avec Matou, heu je voulais dire Mathis votre coach de feu de Dieu !!! (Torture pendant 1 minute. Le mari râle et appuie sur l'appli.)
Matou  : (voix enregistrée) Je vous vois, je vous vois, vous m'avez arrêté mais je suis toujours là à votre service.
Bruno  : (hurlant depuis les coulisses, sa voix ensommeillée et furieuse) Ta gueule !
Nicole : (elle se réveille, elle ne comprend pas pourquoi son mari râle) Oh ! Mais qu'est-ce qui se passe, pourquoi tu cries comme ça ?
Bruno  : Pourquoi je crie ? Pourquoi je crie ? Tu me demandes grrr ! Parce que ça fait une semaine que ton abruti de coach me saoule tous les matins, surtout à 6h du matin. Je n'ai pas de TGV à prendre, je ne me lève pas pour faire ma prière, je ne travaille pas non plus entre 6 et 8h du matin ! Alors oui moi à 6h je dors encore, merde. (Et il râle de nouveau, il grogne...)
Nicole : Quoi ? (À moitié endormie encore, elle se lève et va dans la salle de bain.)
Bruno  : Rien, et voilà que tu es sourde ma pauvre. (On entend la voix jeune et dynamique du coach qui baragouine des choses.) Mais retenez-moi je vais le tuer ! Putain au secours !
Nicole : Tu râles tout le temps, tu deviens pénible. (De la salle de bain. Elle arrive sur scène en peignoir.) Oh ! Mince je vais être en retard pour le cours. (Elle parle toute seule car son mari reste couché.)
Bruno  : (il murmure) Tu as un rendez-vous hyper tôt ce matin ? Ma parole tu es devenue folle ???
Nicole : Non mais je veux être prête, c'est à 10h mais il y a du boulot à mon âge. (Elle monologue seule face public.) Je prie pour qu'on soit tous les deux aujourd'hui, pourvu... J'aimerais l'avoir pour moi toute seule. Oui je sais il est un peu jeune pour moi mais et alors ? Après tout on n'a qu'une vie ? Non ?
Bruno  : (Le mari ronchon finit par se lever au radar et traverse la pièce pour disparaître dans la cuisine, la porte à côté de l'entrée.) Un bon café maintenant que je suis réveillé.
Nicole : Comment je vais m'habiller ? Mince j'ai encore grossi. Je ne comprends pas, je ne mange plus de sucre, je mange plus de légumes et de fruits et j'ai l'impression de gonfler comme une montgolfière mais sans voler ! Pourtant son programme garanti « Pleine vitalité » est supposé faire mincir. OK minceur, corps de déesse (elle se regarde) là c'est pas gagné ! OK voyons le côté positif : vitalité ça peut aller. Minceur heu ? À la loupe alors ou au microscope. Chéri tu ne trouves pas que j'ai minci ?
Bruno  : Quoi encore ?
Nicole : Voilà, rien. (Ça fait bien longtemps que je n'existe plus à ses yeux.) L'avantage c'est qu'il ne voit pas mes défauts mais il voit bien les qualités de certaines autres.
Bruno  : (toujours dans la cuisine, ronchonnant) De quoi tu parles ?
Nicole : Rien ? Rien ? Bonne journée. (Elle met une tenue un peu trop sexy, voire un peu ridicule. Le mari a fini de boire son café et revient sur scène.)
Bruno  : Ah ! Mon Dieu c'est quoi cette tenue ?
Nicole : (vexée) Tu n'y connais rien !
Bruno  : Si tu veux ressembler à une pouf c'est réussi ! Ou encore mieux au lampadaire dans le sketch de... tu sais ? (Et il se met à rire !) « Le lampadaire c'est moi ».
Nicole : Merci beaucoup ! C'est fou comme je me sens encouragée avec toi.
Bruno  : Oh ! Mais tu es très bien comme ça. Pourquoi tu t'obstines à vouloir rester jeune ?
Nicole : (en colère) Goujat ! Pauvre con !
Bruno  : Non ! Mais attends ce n'est pas ce que j'ai voulu dire. Pourquoi tu veux te muscler alors que tu es très bien comme ça ? Encore une lubie comme tout le monde. (Il rit.) Tu n'es pas une athlète de haut niveau. Même eux ils prennent un jour leur retraite.
Nicole : Décidément, tu ne comprends rien !
Bruno  : Non mais si tu remets l'appli pour 6h du mat, je demande le divorce ou je fais chambre à part.
Nicole : Pour ce que ça change ? Tu as raison.
Bruno  : Je suis fatigué moi ! Je vais me reposer dans le bureau, il y a un bon canapé ! Et j'ai des dossiers en retard ! Bon allez à ce soir ? (Le bureau se trouve à côté de la chambre, mais il a également son bureau en dehors avec un bon canapé.)
Nicole : Mais oui bien sûr. Fuis-moi je te suis, suis-moi je te fuis, mais quelle connerie ! Si je tenais l'abruti qui a dit que de fuir son homme ça le faisait revenir. Je lui ferais bouffer sa tablette, son iPhone, son Android, sa Nintendo d'attardé de cerveau masculin. Car c'est un homme qui a pondu ça ! Moi j'essaye avec le mien c'est la Bérézina, nada, rien... Depuis que j'ai choisi ce coach sur ce site je me sens toute bizarre, il faut dire qu'il est très beau ce jeune homme et je suis attirée par lui, oui je sais c'est idiot vu qu'on ne s'est jamais rencontrés, mais je me sens toute chose. Oh ! Là ! Là ! Je parle ! Je parle, ça c'est tout moi ça... Je veux arriver en avance. Pourvu qu'on soit tous les deux. Oui mais si lui n'est pas là... Mais que je suis bête, il sera forcément là puisque c'est chez lui le cours. Nicole il faut que tu te ressaisisses voyons !
Bruno  : (Il revient sur ses pas, il a oublié quelque chose. Il entend qu'elle parle toute seule.) Hein, avec qui tu parles ? Bon, pas avec moi apparemment ???
Nicole : Moi ? Personne voyons, je parlais de Françoise qui va venir, tu sais, mon amie.
Bruno  : Bon ! Bon ! J'y vais ! (il lance) Tu voudrais pas ranger ? Car là c'est l'horreur ! (Il parle en râlant... Ils ne s'écoutent plus l'un et l'autre... Monologue de chacun dans son coin.)
Nicole : Oui ! Oui. « Bonne journée ma chérie, tu vas bien ce matin ? Alors, heureuse ? » Ce sont des phrases que je n'entends plus. J'ai l'impression de faire partie des meubles. Et encore les meubles on leur donne un petit coup pour les nettoyer de temps en temps... Mais qu'est-ce que je raconte moi ??? C'est ce jeune Matou. Allez je file me préparer, je suis folle mais j'assume.
###Scène 2
Matou  : (Pour des raisons financières, notre jeune Matou donne ses cours chez lui en attendant de trouver une salle. Nicole arrive et elle n'est pas contente car il y a une jeune femme qui est déjà avec Matou.) Bonjour, je me présente : Mathis, mais pour les intimes c'est Matou, pour vous coacher mes belles ! Si vous êtes sages ! Mais ça vous le savez déjà car vous avez eu le plaisir de m'entendre tous les matins de bon matin !
Lili   : Matou, comment vous faites pour être aussi joyeux ? Avec tout ce qui se passe... (Elle commence à renifler.)
Matou  : Non ! Non, pas de ça avec moi, j'ai horreur des gens qui pleurnichent. C'est dans la tête tout ça. On prend une grande respiration et on expire.
Lili   : (suffoque)
Matou  : Mais non, on ne bloque pas, on inspire et on expire.
Lili   : (s'accroche à lui) Je n'y arrive pas...
Matou  : Mais si ! Mais si, ça sera cher !
Lili   : Quoi ?
Matou  : Heu ! Ce sera dur pour vous mais on y arrivera.
Lili   : C'est que j'ai déjà 25 ans. (Et elle repleure.)
Matou  : C'est très bien ça d'avoir 25 ans. Vous gagnez combien ?
Lili   : Hein ?
Matou  : Pardon, vous faites quoi de beau dans la vie Lili ?
Lili   : Je fais des études pour devenir infirmière mais je ne veux pas continuer...
Matou  : Tu m'étonnes ! Eh bien oui je comprends. (Elle a raison, elle déprimerait les malades.)
Lili   : Bon alors qu'est-ce que vous allez faire pour moi docteur ?
Matou  : Non, pas de transfert tout de suite, je ne suis pas docteur, mais on va essayer de remodeler tout ça ! (Il la regarde pour voir les différentes possibilités susceptibles de lui convenir.) C'est pas gagné... mais on va y arriver, allez on s'accroche...
Lili   : En plus je suis grosse.
Matou  : Vous les femmes vous avez toujours quelque chose. (Et heureusement pour moi !!!)
Lili   : (avec Nicole) Hein ???
Nicole : (avec Lili) Hein ???
Matou  : Je suis là pour vous aider ! (Et il se tourne vers Nicole. Elle regarde le coach qui l'a bien ignorée pendant qu'il parlait à Lili. Avec un large sourire :) Comment ça va, vous ? (Il cherche son nom...)
Nicole : (vexée) Nicole !!!! Mal, pas bien du tout ! Que me préconisez-vous aujourd'hui ? Je suis prête à mettre le paquet...
Matou  : Formidable !
Lili   : Quel sera le programme ?
Matou  : Quel programme ? Voyons, vous n'avez pas vu mon DVD, application Bluetooth connectée 24h/24 pour avancer dans votre vie ?
Nicole : (les deux femmes se regardent dubitatives, en chœur avec Lili) Non !
Lili   : (en chœur avec Nicole) Non !
Matou  : Bon, je vois manifestement que vous ne lisez pas vos messages. Bon je vous explique en deux mots car je n'ai pas que ça à faire non plus... 1ère semaine vous écoutez tous les soirs pour vous (en désignant Nicole) et pour vous (en désignant Lili) la totale : matin, midi et soir et même en pleine nuit si vous n'arrivez pas à dormir. C'est connecté directement sur votre portable et il y a un rappel, si ! C'est génial non ?
Nicole : Et ça parle de quoi ?
Lili   : Oui ça parle de quoi votre truc là ? Pour l'avenir, votre bien-être ? (Elles le regardent, perplexes.)
Matou  : Ce sont des mantras hyper puissants qui vont changer votre vie. Ça rééquilibre le corps et le mental. Je vous ai concocté des programmes sur mesure.
Lili   : Sans me connaître ?
Matou  : Mais yes ! Oui c'est parce que je suis le meilleur. Toi tu as besoin de prendre confiance en toi, non ? Je ne me trompe pas ?
Lili   : Oui, comment vous le savez ?
Matou  : (jouant le modeste) Je suis trop fort. Tu n'es pas adaptée pour cette vie et c'est là que j'interviens. Tiens-toi droite. (Lili lève le doigt comme à l'école.) Chut, on ne dit plus rien, on intériorise ce que je viens de dire. Voilà, très bien !
Lili   : (muette, droite comme un piquet, terrifiée)
Matou  : Mais on respire Lili. (Il va vers Nicole qui le dévore des yeux.) Vous ce sera : on muscle les bras, les jambes, (il la scrute de haut en bas) il y a du boulot.
Nicole : (en aparté) C'est agréable !!! Montrez-moi ! (Elle l'attrape par le bras. Elle lui montre trop son désir, mettant en avant sa poitrine généreuse, comme s'ils allaient danser un tango... Fantasme.)
Matou  : Non mais ce n'est pas si grave que cela, vous Nicole les applications devraient suffire pour le début.
Nicole : (déçue) Mon mari va me tuer !
Matou  : Oui bon, si vous vous tenez tranquille on peut éventuellement se voir 2 fois par semaine ! Voilà, je vous propose de venir toutes les deux, vous vous soutiendrez, vous aimez ça vous l'entraide, les femmes. Le temps que je trouve d'autres clientes...
Lili   : Oui je suis d'accord.
Nicole : Non, pas moi, on n'a pas le même programme.

    <script>
        // Parse the play text
        function parsePlayText(text) {
            const lines = text.split('\n');
            const playData = {
                title: '',
                acts: []
            };

            let currentAct = null;
            let currentScene = null;

            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                // Title (# Title)
                if (line.startsWith('#') && !line.startsWith('##')) {
                    playData.title = line.substring(1).trim();
                }
                // Act (## Act X)
                else if (line.startsWith('##') && !line.startsWith('###')) {
                    currentAct = {
                        title: line.substring(2).trim(),
                        scenes: []
                    };
                    playData.acts.push(currentAct);
                    currentScene = null;
                }
                // Scene (### Scene X)
                else if (line.startsWith('###')) {
                    if (currentAct) {
                        currentScene = {
                            title: line.substring(3).trim(),
                            dialogues: []
                        };
                        currentAct.scenes.push(currentScene);
                    }
                }
                // Dialogue (Character : Text)
                else if (line.includes(':')) {
                    const colonIndex = line.indexOf(':');
                    const character = line.substring(0, colonIndex).trim();
                    const text = line.substring(colonIndex + 1).trim();
                    
                    if (currentScene && character && text) {
                        currentScene.dialogues.push({
                            character: character,
                            text: text
                        });
                    }
                }
            });

            return playData;
        }

        // Parse the play data
        const playData = parsePlayText(rawPlayText);

        // Update page title
        document.title = playData.title || 'Pièce de théâtre';

        // State management
        let currentTab = 'read';
        let selectedCharacter = '';
        let learnState = {
            actIndex: 0,
            sceneIndex: 0,
            lineIndex: 0
        };
        let readState = {
            actIndex: 0,
            sceneIndex: 0
        };

        // Storage management functions (localStorage works with file://)
        function setStorage(name, value) {
            try {
                localStorage.setItem(name, value);
            } catch (e) {
                console.error('Error saving to localStorage:', e);
            }
        }

        function getStorage(name) {
            try {
                return localStorage.getItem(name);
            } catch (e) {
                console.error('Error reading from localStorage:', e);
                return null;
            }
        }

        // Extract unique characters
        function getCharacters() {
            const characters = new Set();
            playData.acts.forEach(act => {
                act.scenes.forEach(scene => {
                    scene.dialogues.forEach(dialogue => {
                        characters.add(dialogue.character);
                    });
                });
            });
            return Array.from(characters).sort();
        }

        // Generate a consistent color for each character
        const characterColors = {};
        
        // Color palettes for light and dark modes
        const colorPalettesLight = [
            '#c0392b', // dark red
            '#2980b9', // dark blue
            '#27ae60', // dark green
            '#d68910', // dark orange
            '#8e44ad', // dark purple
            '#16a085', // dark turquoise
            '#d35400', // dark carrot
            '#2c3e50', // very dark blue
            '#117a65', // very dark green
            '#922b21', // very dark red
            '#6c3483', // dark wisteria
            '#1e8449', // dark nephritis
        ];

        const colorPalettesDark = [
            '#ff6b6b', // bright red
            '#74b9ff', // bright blue
            '#55efc4', // bright green
            '#ffd93d', // bright yellow
            '#dda0dd', // bright plum
            '#6bcf7f', // bright mint
            '#ffa07a', // bright salmon
            '#87ceeb', // sky blue
            '#98d8c8', // light teal
            '#ff9999', // light coral
            '#c39bd3', // light purple
            '#90ee90', // light green
        ];

        function isDarkMode() {
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        function getCharacterColor(character) {
            if (!characterColors[character]) {
                const colorPalette = isDarkMode() ? colorPalettesDark : colorPalettesLight;
                const characters = Object.keys(characterColors);
                const colorIndex = characters.length % colorPalette.length;
                characterColors[character] = colorPalette[colorIndex];
            }
            return characterColors[character];
        }

        // Listen for theme changes and update colors
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                // Reset character colors to apply new palette
                Object.keys(characterColors).forEach(key => delete characterColors[key]);
                
                // Re-render current tab
                if (currentTab === 'read') {
                    renderReadTab();
                } else if (currentTab === 'learn') {
                    renderLearnTab();
                }
            });
        }

        // Update page title with character if selected
        function updateTitle() {
            const baseTitle = playData.title;
            const displayTitle = selectedCharacter ? `${baseTitle} - ${selectedCharacter}` : baseTitle;
            document.getElementById('play-title').textContent = displayTitle;
        }

        // Initialize the app
        function init() {
            // Load settings first
            loadSettings();
            
            // Setup UI
            populateCharacterSelect();
            updateTitle();
            setupTabs();
            
            // Restore saved tab or default to 'read'
            const savedTab = getStorage('currentTab') || 'read';
            switchTab(savedTab);
        }

        // Populate character dropdown
        function populateCharacterSelect() {
            const select = document.getElementById('character-select');
            const characters = getCharacters();
            characters.forEach(char => {
                const option = document.createElement('option');
                option.value = char;
                option.textContent = char;
                select.appendChild(option);
            });

            select.addEventListener('change', (e) => {
                selectedCharacter = e.target.value;
                saveSettings();
                updateTitle();
                
                // Re-render current tab
                if (currentTab === 'read') {
                    renderReadTab();
                } else if (currentTab === 'learn') {
                    renderLearnTab();
                }
            });
            
            // Text size buttons
            document.querySelectorAll('.text-size-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const size = this.dataset.size;
                    applyTextSize(size);
                    setStorage('textSize', size);
                });
            });

            // Fullscreen button
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', toggleFullscreen);
            }
        }

        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
                // Enter fullscreen
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.mozRequestFullScreen) {
                    elem.mozRequestFullScreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                // Exit fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        // Setup tab navigation
        function setupTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabName = tab.getAttribute('data-tab');
                    switchTab(tabName);
                });
            });
        }

        // Switch between tabs
        function switchTab(tabName) {
            currentTab = tabName;
            setStorage('currentTab', tabName);
            
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.getAttribute('data-tab') === tabName) {
                    tab.classList.add('active');
                }
            });

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`${tabName}-tab`).classList.add('active');

            // Render specific tab content if needed
            if (tabName === 'learn') {
                renderLearnTab();
            } else if (tabName === 'read') {
                renderReadTab();
            }
        }

        // Render Read Tab
        function renderReadTab() {
            const container = document.getElementById('read-content');
            container.innerHTML = '';

            playData.acts.forEach((act, actIndex) => {
                act.scenes.forEach((scene, sceneIndex) => {
                    const sceneTitle = document.createElement('div');
                    sceneTitle.className = 'learn-scene-header';
                    
                    const titleSpan = document.createElement('span');
                    titleSpan.textContent = `${act.title}, ${scene.title}`;
                    
                    const arrowSpan = document.createElement('span');
                    arrowSpan.className = 'arrow-icon';
                    arrowSpan.textContent = '▼';
                    
                    sceneTitle.appendChild(titleSpan);
                    sceneTitle.appendChild(arrowSpan);
                    sceneTitle.onclick = () => {
                        readState.actIndex = actIndex;
                        readState.sceneIndex = sceneIndex;
                        setStorage('readState', readState);
                        openNavigation('read');
                    };
                    
                    container.appendChild(sceneTitle);

                    const sceneBlock = document.createElement('div');
                    sceneBlock.className = 'scene-block';

                    scene.dialogues.forEach(dialogue => {
                        const dialogueDiv = document.createElement('div');
                        dialogueDiv.className = 'dialogue';
                        
                        if (selectedCharacter && dialogue.character === selectedCharacter) {
                            dialogueDiv.classList.add('highlight');
                        }

                        const charSpan = document.createElement('span');
                        charSpan.className = 'dialogue-character';
                        charSpan.textContent = dialogue.character;
                        charSpan.style.color = getCharacterColor(dialogue.character);

                        const textSpan = document.createElement('span');
                        textSpan.className = 'dialogue-text';
                        textSpan.textContent = dialogue.text;

                        dialogueDiv.appendChild(charSpan);
                        dialogueDiv.appendChild(textSpan);
                        sceneBlock.appendChild(dialogueDiv);
                    });

                    container.appendChild(sceneBlock);
                });
            });
            
            // Validate readState indices
            if (readState.actIndex >= playData.acts.length) {
                readState.actIndex = 0;
            }
            if (readState.sceneIndex >= playData.acts[readState.actIndex].scenes.length) {
                readState.sceneIndex = 0;
            }
            
            // Scroll to the saved scene position
            setTimeout(() => {
                const sceneBlocks = document.querySelectorAll('#read-content .scene-block');
                let totalSceneIndex = 0;
                for (let i = 0; i < readState.actIndex; i++) {
                    totalSceneIndex += playData.acts[i].scenes.length;
                }
                totalSceneIndex += readState.sceneIndex;
                
                if (sceneBlocks[totalSceneIndex]) {
                    sceneBlocks[totalSceneIndex].scrollIntoView({ behavior: 'auto', block: 'start' });
                }
            }, 0);
        }

        // Render Learn Tab
        function renderLearnTab(clearContent = true) {
            const content = document.getElementById('learn-content');
            if (clearContent) {
                content.innerHTML = '';
            }

            // Check if no character is selected
            if (!selectedCharacter) {
                content.innerHTML = '<div style="padding: 40px 20px; text-align: center;"><p style="color: var(--text-secondary); font-size: 18px; margin-bottom: 16px;">Aucun personnage sélectionné</p><p style="color: var(--text-muted); font-size: 14px;">Veuillez sélectionner un personnage dans l\'onglet Paramètres pour commencer l\'apprentissage.</p></div>';
                document.getElementById('line-counter').textContent = '0 / 0';
                const nextButton = document.querySelector('.btn-next');
                const backButton = document.querySelector('.btn-back');
                if (nextButton) nextButton.disabled = true;
                if (backButton) backButton.disabled = true;
                return;
            }

            // Validate learnState indices
            if (learnState.actIndex >= playData.acts.length) {
                learnState.actIndex = 0;
            }
            if (learnState.sceneIndex >= playData.acts[learnState.actIndex].scenes.length) {
                learnState.sceneIndex = 0;
            }

            // Get current scene
            const act = playData.acts[learnState.actIndex];
            const scene = act.scenes[learnState.sceneIndex];

            // Update scene header
            document.getElementById('learn-current-scene').textContent = 
                `${act.title}, ${scene.title}`;

            const lines = scene.dialogues;

            if (lines.length === 0) {
                content.innerHTML = '<p style="color: #95a5a6; text-align: center;">Aucune réplique dans cette scène.</p>';
                document.getElementById('line-counter').textContent = '0 / 0';
                return;
            }

            // Find character's lines and their indices
            const characterLines = [];
            lines.forEach((dialogue, index) => {
                if (dialogue.character === selectedCharacter) {
                    characterLines.push(index);
                }
            });

            if (characterLines.length === 0) {
                content.innerHTML = '<p style="color: #95a5a6; text-align: center;">Aucune réplique pour ce personnage dans cette scène.</p>';
                document.getElementById('line-counter').textContent = '0 / 0';
                return;
            }

            // Update counter based on character's lines
            document.getElementById('line-counter').textContent = 
                `${learnState.lineIndex} / ${characterLines.length}`;

            // When clearContent is true (initial load or restart), show all dialogues up to current state
            // When clearContent is false (appending), show only the new dialogues
            let startIndex, endIndex;
            
            if (clearContent) {
                // Show all dialogues from start up to current lineIndex
                startIndex = 0;
                if (learnState.lineIndex === 0) {
                    endIndex = characterLines[0];
                } else {
                    const currentCharLineIndex = Math.min(learnState.lineIndex - 1, characterLines.length - 1);
                    endIndex = learnState.lineIndex < characterLines.length 
                        ? characterLines[learnState.lineIndex] 
                        : lines.length;
                }
            } else {
                // Append mode: show only new dialogues
                if (learnState.lineIndex === 0) {
                    startIndex = 0;
                    endIndex = characterLines[0];
                } else {
                    const currentCharLineIndex = Math.min(learnState.lineIndex - 1, characterLines.length - 1);
                    startIndex = characterLines[currentCharLineIndex];
                    endIndex = learnState.lineIndex < characterLines.length 
                        ? characterLines[learnState.lineIndex] 
                        : lines.length;
                }
            }

            // Display the dialogues in the range
            for (let i = startIndex; i < endIndex; i++) {
                const dialogue = lines[i];
                const dialogueDiv = document.createElement('div');
                dialogueDiv.className = 'dialogue';
                
                // Highlight selected character's lines
                if (dialogue.character === selectedCharacter) {
                    dialogueDiv.classList.add('my-character');
                }

                const charSpan = document.createElement('span');
                charSpan.className = 'dialogue-character';
                charSpan.textContent = dialogue.character;
                charSpan.style.color = getCharacterColor(dialogue.character);

                const textSpan = document.createElement('span');
                textSpan.className = 'dialogue-text';
                textSpan.textContent = dialogue.text;

                dialogueDiv.appendChild(charSpan);
                dialogueDiv.appendChild(textSpan);
                content.appendChild(dialogueDiv);
            }
            
            // Update button state
            const nextButton = document.querySelector('.btn-next');
            const backButton = document.querySelector('.btn-back');
            if (nextButton) {
                nextButton.disabled = learnState.lineIndex >= characterLines.length;
            }
            if (backButton) {
                backButton.disabled = learnState.lineIndex === 0;
            }
        }

        // Next line in Learn mode
        function nextLine() {
            const act = playData.acts[learnState.actIndex];
            const scene = act.scenes[learnState.sceneIndex];
            const lines = scene.dialogues;

            // If no character selected, advance one line at a time
            if (!selectedCharacter) {
                if (learnState.lineIndex < lines.length - 1) {
                    learnState.lineIndex++;
                    saveSettings();
                    renderLearnTab();
                }
                return;
            }

            // Find character's lines
            const characterLines = [];
            lines.forEach((dialogue, index) => {
                if (dialogue.character === selectedCharacter) {
                    characterLines.push(index);
                }
            });

            // Advance to next step
            if (learnState.lineIndex < characterLines.length) {
                const oldLineIndex = learnState.lineIndex;
                learnState.lineIndex++;
                saveSettings();
                renderLearnTab(false); // Don't clear content, just append
                
                // Scroll to the first newly added dialogue
                setTimeout(() => {
                    const content = document.getElementById('learn-content');
                    const newDialogues = content.querySelectorAll('.dialogue');
                    
                    // Calculate the index of the first new dialogue
                    let firstNewIndex = 0;
                    if (oldLineIndex === 0) {
                        // On first click, scroll to the character's first line
                        firstNewIndex = characterLines[0];
                    } else {
                        const prevCharLineIndex = oldLineIndex - 1;
                        const prevEndIndex = oldLineIndex < characterLines.length 
                            ? characterLines[oldLineIndex] 
                            : lines.length;
                        firstNewIndex = prevEndIndex;
                    }
                    
                    if (newDialogues[firstNewIndex]) {
                        newDialogues[firstNewIndex].scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }, 50);
            }
        }

        // Restart scene in Learn mode
        function restartScene() {
            learnState.lineIndex = 0;
            saveSettings();
            renderLearnTab(true); // Clear content and restart
        }

        // Open navigation modal
        function openNavigation(source) {
            const modal = document.getElementById('navigation-modal');
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = '';

            playData.acts.forEach((act, actIndex) => {
                const actItem = document.createElement('div');
                actItem.className = 'nav-item nav-act';
                actItem.textContent = act.title;
                actItem.onclick = () => navigateToScene(actIndex, 0, source);
                modalBody.appendChild(actItem);

                act.scenes.forEach((scene, sceneIndex) => {
                    const sceneItem = document.createElement('div');
                    sceneItem.className = 'nav-item nav-scene';
                    sceneItem.textContent = scene.title;
                    sceneItem.onclick = () => navigateToScene(actIndex, sceneIndex, source);

                    if (source === 'learn' && actIndex === learnState.actIndex && sceneIndex === learnState.sceneIndex) {
                        sceneItem.classList.add('current');
                    }

                    modalBody.appendChild(sceneItem);
                });
            });

            modal.classList.add('active');
        }

        // Close navigation modal
        function closeNavigation(event) {
            if (event.target.id === 'navigation-modal') {
                document.getElementById('navigation-modal').classList.remove('active');
            }
        }

        // Navigate to a specific scene
        function navigateToScene(actIndex, sceneIndex, source) {
            if (source === 'learn') {
                learnState.actIndex = actIndex;
                learnState.sceneIndex = sceneIndex;
                learnState.lineIndex = 0;
                saveSettings();
                renderLearnTab();
            } else if (source === 'read') {
                readState.actIndex = actIndex;
                readState.sceneIndex = sceneIndex;
                saveSettings();
                
                // Scroll to the scene block
                const sceneBlocks = document.querySelectorAll('#read-content .scene-block');
                let totalSceneIndex = 0;
                for (let i = 0; i < actIndex; i++) {
                    totalSceneIndex += playData.acts[i].scenes.length;
                }
                totalSceneIndex += sceneIndex;
                
                if (sceneBlocks[totalSceneIndex]) {
                    sceneBlocks[totalSceneIndex].scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }

            closeNavigation({ target: { id: 'navigation-modal' } });
        }

        // Save settings to localStorage
        function saveSettings() {
            setStorage('selectedCharacter', selectedCharacter);
            setStorage('readState', JSON.stringify(readState));
            setStorage('learnState', JSON.stringify(learnState));
        }

        // Load settings from localStorage
        function loadSettings() {
            const savedCharacter = getStorage('selectedCharacter');
            if (savedCharacter) {
                selectedCharacter = savedCharacter;
                const select = document.getElementById('character-select');
                if (select) {
                    select.value = savedCharacter;
                }
            }

            const savedReadState = getStorage('readState');
            if (savedReadState) {
                try {
                    readState = JSON.parse(savedReadState);
                } catch (e) {
                    console.error('Error parsing readState:', e);
                }
            }

            const savedLearnState = getStorage('learnState');
            if (savedLearnState) {
                try {
                    learnState = JSON.parse(savedLearnState);
                } catch (e) {
                    console.error('Error parsing learnState:', e);
                }
            }
            
            // Load and apply text size
            const textSize = getStorage('textSize') || 'normal';
            applyTextSize(textSize);
        }
        
        // Apply text size to body
        function applyTextSize(size) {
            document.body.classList.remove('text-small', 'text-normal', 'text-large');
            document.body.classList.add(`text-${size}`);
            
            // Update button states
            document.querySelectorAll('.text-size-btn').forEach(btn => {
                if (btn.dataset.size === size) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Initialize the app when DOM is ready
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
